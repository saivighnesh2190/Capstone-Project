[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nestedtune-guard"
version = "1.0.0"
description = "Deadlock-aware distributed hyperparameter tuning for nested trainers (CINT-11)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "NestedTune Guard project", email = "cint11@kluniversity.example"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2",
]

[project.urls]
Homepage = "https://github.com/saivighnesh2190/Capstone-Project"

[tool.setuptools.packages.find]
include = ["nestedtune_guard*"]
