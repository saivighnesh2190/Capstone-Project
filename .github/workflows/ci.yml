name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Python tests + CP-1 gate
  # --------------------------------------------------------------------------
  python-tests:
    name: Python tests + CP-1 gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pytest
        run: pip install pytest

      - name: Install package + API deps
        run: pip install -e '.[dev]'

      - name: Run 70 automated tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 -m pytest nestedtune_guard/tests/ -v --tb=short

      - name: Run CP-1 gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          chmod +x ./scripts/run_cp1.sh
          ./scripts/run_cp1.sh
        timeout-minutes: 5

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp1-evidence
          path: |
            evidence/
            charts/
          retention-days: 14

  # --------------------------------------------------------------------------
  # Job 2: Next.js dashboard lint + build
  # --------------------------------------------------------------------------
  dashboard-build:
    name: Dashboard lint + build
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python (for /api/simulate routes)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build for production
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PYTHONPATH: ${{ github.workspace }}

  # --------------------------------------------------------------------------
  # Job 3: Docker build (build the image, don't push — that's a release job)
  # --------------------------------------------------------------------------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [python-tests, dashboard-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (smoke test the Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: nestedtune-guard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Job 4: Helm chart lint (kubeconform-style validation)
  # --------------------------------------------------------------------------
  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Helm lint
        run: helm lint deploy/helm/

      - name: Helm template (smoke test rendering)
        run: |
          helm template nestedtune-guard deploy/helm/ \
            --namespace nestedtune-guard \
            > /tmp/rendered.yaml
          echo "Rendered $(wc -l < /tmp/rendered.yaml) lines of YAML"

  # --------------------------------------------------------------------------
  # Job 5: Release (only on main branch push, only if all jobs pass)
  # --------------------------------------------------------------------------
  release:
    name: Release (tag + push image)
    runs-on: ubuntu-latest
    needs: [python-tests, dashboard-build, docker-build, helm-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/nestedtune-guard
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
